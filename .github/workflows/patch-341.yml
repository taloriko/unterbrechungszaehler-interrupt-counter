name: Apply 3.4.1 patch

on:
  push:
    branches:
      - feature/3.4.1-audio-follow-spam-flicker

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.4.1-audio-follow-spam-flicker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch 3.4.1 sources and documentation
        run: python .github/patch_341.py
      - name: Regenerate web bundle
        run: python Unterbrechungszaehler/tools/build_web.py
      - name: Run portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py
      - name: Commit 3.4.1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-341.yml .github/patch_341.py
          git add README.md CHANGELOG.md Unterbrechungszaehler
          git add -u
          git commit -m "Release Unterbrechungszähler 3.4.1"
          git push origin HEAD:feature/3.4.1-audio-follow-spam-flicker
