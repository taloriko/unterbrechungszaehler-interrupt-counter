name: Harden 3.4.0 anti-spam

on:
  push:
    branches:
      - feature/3.4.0-physical-button-anti-spam
    paths:
      - .github/fix_340.py
      - .github/workflows/fix-340.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hardening
        run: python .github/fix_340.py
      - name: Portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py
      - name: Remove helpers and commit
        run: |
          rm -f .github/fix_340.py .github/workflows/fix-340.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden 3.4.0 anti-spam audio feedback"
          git push
