name: Apply audio startup priority

on:
  push:
    branches:
      - design/433mhz-multisource
    paths:
      - Unterbrechungszaehler/tools/apply_audio_startup_priority.py
      - .github/workflows/apply-audio-startup-priority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/433mhz-multisource
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python Unterbrechungszaehler/tools/apply_audio_startup_priority.py
      - name: Portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py
      - name: Remove one-shot helpers
        run: |
          git rm Unterbrechungszaehler/tools/apply_audio_startup_priority.py
          git rm .github/workflows/apply-audio-startup-priority.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unterbrechungszaehler/audio_dy_sv17f.cpp Unterbrechungszaehler/hardware_config.h
          git diff --cached --check
          git commit -m "Prioritize audio playback during startup"
          git push origin HEAD:design/433mhz-multisource
