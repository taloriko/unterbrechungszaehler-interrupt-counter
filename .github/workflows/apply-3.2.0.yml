name: Apply 3.2.0 feature

on:
  push:
    branches:
      - feature/3.2.0-work
    paths:
      - .github/workflows/apply-3.2.0.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply firmware changes
        run: python3 Unterbrechungszaehler/tools/apply_3_2_0_firmware.py

      - name: Apply UI and documentation changes
        run: python3 Unterbrechungszaehler/tools/apply_3_2_0_ui_docs.py

      - name: Generate embedded Web UI
        run: python3 Unterbrechungszaehler/tools/build_web.py

      - name: Run portable release checks
        run: python3 Unterbrechungszaehler/tools/release_check.py

      - name: Commit generated 3.2.0 feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Unterbrechungszaehler 3.2.0"
          git push origin HEAD:feature/3.2.0-work
