name: Polish 3.2.0 C++

on:
  push:
    branches:
      - feature/3.2.0-work
    paths:
      - .github/workflows/polish-3.2.0.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply C++ polish
        run: python3 Unterbrechungszaehler/tools/polish_3_2_0_cpp.py
      - name: Run release checks
        run: python3 Unterbrechungszaehler/tools/release_check.py
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unterbrechungszaehler/audio_dy_sv17f.cpp Unterbrechungszaehler/interruption_service.cpp Unterbrechungszaehler/Unterbrechungszaehler.ino
          git diff --cached --check
          git commit -m "Polish Unterbrechungszaehler 3.2.0 runtime"
          git push origin HEAD:feature/3.2.0-work
