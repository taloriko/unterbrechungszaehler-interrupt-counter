name: Apply modular hardware refactor

on:
  push:
    branches:
      - design/433mhz-multisource

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run modular hardware refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/433mhz-multisource
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply refactor
        run: python Unterbrechungszaehler/tools/apply_modular_hardware_refactor.py
      - name: Rebuild embedded web assets
        run: python Unterbrechungszaehler/tools/build_web.py
      - name: Portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py
      - name: Diff sanity
        run: git diff --check
      - name: Commit refactor
        run: |
          git config user.name 'taloriko'
          git config user.email '67206692+taloriko@users.noreply.github.com'
          git add Unterbrechungszaehler
          git commit -m 'Refactor optional hardware runtime around RMT and BUSY'
          git push
