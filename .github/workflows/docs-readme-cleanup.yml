name: README and changelog cleanup

on:
  push:
    branches:
      - docs/readme-changelog-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-changelog-cleanup
          fetch-depth: 0

      - name: Clean README version history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme_path = Path('README.md')
          text = readme_path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'## Versionsstand 3\.x\n\n\| Version \| Technische Erweiterung \|\n\|---\|---\|\n(?:\|.*\n)+\n## Pinbelegung',
              re.MULTILINE,
          )
          replacement = (
              '## Versionsverlauf\n\n'
              'Der vollständige technische Versionsverlauf steht im [Changelog](CHANGELOG.md).\n\n'
              '## Pinbelegung'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Version table replacement failed: {count}')

          replacements = {
              'Ab 3.2.0 ist die Lautstärke in der Weboberfläche von **0–100 %** einstellbar;':
                  'Die Lautstärke ist in der Weboberfläche von **0–100 %** einstellbar;',
              'Seit 3.4.0 ist Track 2 für Anti-Spam reserviert;':
                  'Track 2 ist für Anti-Spam reserviert;',
              '## Display in 3.2.0': '## Display',
              '## Datenpflege & Herkunftsfilter in 3.3.0': '## Datenpflege & Herkunftsfilter',
              '### DY-SV17F-Diagnose in 3.3.1': '### DY-SV17F-Diagnose',
              '## Anti-Spam am echten Knopf (3.4.0)': '## Anti-Spam am echten Knopf',
              'Der physische DI1/GPIO-Knopf besitzt ab 3.4.0 eine feste **10-Sekunden-Sperre**:':
                  'Der physische DI1/GPIO-Knopf besitzt eine feste **10-Sekunden-Sperre**:',
              '## DY-SV17F-Webdiagnose in 3.4.1': '## DY-SV17F-Webdiagnose',
              '- [Changelog](CHANGELOG.md)\n': '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing README text: {old}')
              text = text.replace(old, new, 1)

          readme_path.write_text(text, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          old = '- README auf den vollständigen technischen 3.x-Versionsstand und die aktuelle Trackbelegung synchronisiert'
          new = '- README auf den aktuellen technischen Funktionsstand und die aktuelle Trackbelegung synchronisiert; Versionshistorie zentral im Changelog geführt'
          if old not in changelog:
              raise SystemExit('Expected 3.4.1 README changelog entry not found')
          changelog = changelog.replace(old, new, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Verify documentation structure
        shell: bash
        run: |
          test "$(grep -c '^## Versionsverlauf$' README.md)" -eq 1
          test "$(grep -c '\[Changelog\](CHANGELOG.md)' README.md)" -eq 1
          ! grep -q '^## Versionsstand 3\.x$' README.md
          ! grep -Eq '^#{2,3} .*3\.[0-9]+\.[0-9]+' README.md
          grep -q '^## 3\.4\.1$' CHANGELOG.md
          grep -q '^## 3\.4\.0$' CHANGELOG.md
          grep -q '^## 3\.3\.2$' CHANGELOG.md
          grep -q '^## 3\.3\.1$' CHANGELOG.md
          grep -q '^## 3\.3\.0$' CHANGELOG.md
          grep -q '^## 3\.2\.0$' CHANGELOG.md
          grep -q '^## 3\.1\.0$' CHANGELOG.md
          grep -q '^## 3\.0\.1$' CHANGELOG.md
          grep -q '^## 3\.0\.0$' CHANGELOG.md

      - name: Commit documentation cleanup
        shell: bash
        run: |
          git rm .github/workflows/docs-readme-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md CHANGELOG.md
          git commit -m "Keep version history in changelog only"
          git push origin HEAD:docs/readme-changelog-cleanup
