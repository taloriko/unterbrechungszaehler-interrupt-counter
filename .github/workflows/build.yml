name: Firmware build

on:
  push:
    branches:
      - main
      - "reboot/**"
      - "feature/**"
      - "features/**"
  pull_request:
    paths:
      - "arduino/Unterbrechungszaehler/**"
      - "tools/check_translations.py"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check translations
        run: python tools/check_translations.py

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read firmware version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*APP_VERSION\[\] = "\([^"]*\)".*/\1/p' arduino/Unterbrechungszaehler/Config.h)
          if [ -z "$version" ]; then
            echo "Firmware version not found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Create test secrets
        run: cp arduino/Unterbrechungszaehler/Secrets.example.h arduino/Unterbrechungszaehler/Secrets.h
      - name: Compile firmware
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build arduino/Unterbrechungszaehler
          cp build/Unterbrechungszaehler.ino.bin "build/Unterbrechungszaehler-${VERSION}-OTA.bin"
      - name: Upload OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: unterbrechungszaehler-${{ steps.version.outputs.version }}-ota
          path: build/Unterbrechungszaehler-${{ steps.version.outputs.version }}-OTA.bin
          if-no-files-found: error
