name: Apply OTA UI fix

on:
  push:
    branches:
      - fix/ota-ui-ap
    paths:
      - .github/workflows/ota-ui-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply requested changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # Password-protected fallback AP.
          path = 'Unterbrechungszaehler/config.h'
          text = read(path)
          marker = 'constexpr char WIFI_PASSWORD[] = "WIWI_PASSWORD";\n'
          assert marker in text
          assert 'FALLBACK_AP_PASSWORD' not in text
          text = text.replace(marker, marker + 'constexpr char FALLBACK_AP_PASSWORD[] = "Unterbrechungszähler";\n', 1)
          write(path, text)

          path = 'Unterbrechungszaehler/wifi_module.cpp'
          text = read(path)
          assert 'WiFi.softAP(apName, nullptr);' in text
          text = text.replace('WiFi.softAP(apName, nullptr);', 'WiFi.softAP(apName, AppConfig::FALLBACK_AP_PASSWORD);', 1)
          assert 'Fallback AP active | SSID=%s | open network | IP=%s' in text
          text = text.replace('Fallback AP active | SSID=%s | open network | IP=%s', 'Fallback AP active | SSID=%s | password protected | IP=%s', 1)
          write(path, text)

          # Add a percentage to the device API so the existing meter component can render OTA usage.
          path = 'Unterbrechungszaehler/api.cpp'
          text = read(path)
          old = '  appendUIntField(out, "headroomBytes", OtaModule::projectHeadroomBytes(), false);'
          assert old in text
          new = '''  appendUIntField(out, "headroomBytes", OtaModule::projectHeadroomBytes());
          const uint32_t otaMaxBytes = OtaModule::maxFirmwareBytes();
          const uint32_t otaCurrentBytes = OtaModule::currentFirmwareBytes();
          const uint32_t otaUsedPercent = otaMaxBytes == 0
              ? 0
              : static_cast<uint32_t>((static_cast<uint64_t>(otaCurrentBytes) * 100ULL) / otaMaxBytes);
          appendUIntField(out, "usedPercent", otaUsedPercent, false);'''
          text = text.replace(old, new, 1)
          write(path, text)

          # Remove both static OTA notices from all bundled translation data.
          path = 'Unterbrechungszaehler/ui-src/app.js'
          text = read(path)
          text, base_count = re.subn(
              r"^[ \t]*'ota\.unavailable':\s*'(?:\\.|[^'])*',\s*'ota\.apWarning':\s*'(?:\\.|[^'])*',[ \t]*\n",
              '', text, flags=re.MULTILINE)
          text, extra_count = re.subn(
              r'^[ \t]*"ota\.(?:unavailable|apWarning)":\s*"(?:\\.|[^"])*",[ \t]*\n',
              '', text, flags=re.MULTILINE)
          assert base_count == 3, base_count
          assert extra_count == 4, extra_count

          # Remove both static warning components from the OTA card.
          text, component_count = re.subn(
              r"^[ \t]*\{ type: 'notice', kind: 'warning', textKey: 'ota\.(?:apWarning|unavailable)'[^\n]*\n",
              '', text, flags=re.MULTILINE)
          assert component_count == 2, component_count

          # Keep the byte values and add a segmented usage meter below them.
          marker = "            { type: 'upload', id: 'firmware', endpoint: '/api/ota', fieldName: 'firmware', accept: '.bin,application/octet-stream', labelKey: 'ota.file', hintKey: 'ota.hint', buttonKey: 'action.otaUpload', maxPath: 'ota.maxBytes', visibleWhen: { path: 'ota.supported', equals: true } },"
          assert marker in text
          meter = "            { type: 'meter', labelKey: 'label.otaCapacity', path: 'ota.usedPercent', policy: 'heapUsed', format: 'percent' },\n"
          text = text.replace(marker, meter + marker, 1)

          old_state = 'ota: { supported: null, currentBytes: 0, maxBytes: 0, headroomBytes: 0 },'
          new_state = 'ota: { supported: null, currentBytes: 0, maxBytes: 0, headroomBytes: 0, usedPercent: 0 },'
          assert old_state in text
          text = text.replace(old_state, new_state, 1)
          assert 'ota.apWarning' not in text
          assert 'ota.unavailable' not in text
          write(path, text)

          # Lock the intended behaviour into the portable release check.
          path = 'Unterbrechungszaehler/tools/release_check.py'
          text = read(path)
          marker = '    check("RAW_EVENT_CAPACITY = 100000" in project, "100,000 raw-event capacity")\n'
          assert marker in text
          inserted = '''    check('FALLBACK_AP_PASSWORD[] = "Unterbrechungszähler"' in config, "password-protected fallback AP")
              check("ota.apWarning" not in JS and "ota.unavailable" not in JS, "obsolete OTA/AP notices removed")
              check("path: 'ota.usedPercent'" in JS and "type: 'meter'" in JS, "OTA storage utilisation meter")
          '''
          text = text.replace(marker, inserted + marker, 1)
          write(path, text)

          # Documentation follows the actual network behaviour.
          path = 'Unterbrechungszaehler/BASELINE_AUDIT.md'
          text = read(path)
          text = text.replace('- offener Fallback-AP', '- passwortgeschützter Fallback-AP')
          write(path, text)

          replacements = {
              'README.md': (
                  'Wer keine Cloud möchte, sollte das Gerät schließlich trotzdem noch erreichen können.',
                  'Wer keine Cloud möchte, sollte das Gerät schließlich trotzdem noch erreichen können. Der Fallback-AP ist mit `Unterbrechungszähler` geschützt.'),
              'docs/en/README.md': (
                  'If you do not want a cloud, you should still be able to reach the device somehow.',
                  'If you do not want a cloud, you should still be able to reach the device somehow. The fallback AP is protected with the password `Unterbrechungszähler`.'),
              'docs/swg/README.md': (
                  'Wenn ma koi Cloud will, sollt ma s Gerät trotzdem no erreicha könna.',
                  'Wenn ma koi Cloud will, sollt ma s Gerät trotzdem no erreicha könna. Dr Fallback-AP isch mit `Unterbrechungszähler` gschützt.'),
          }
          for path, (old, new) in replacements.items():
              text = read(path)
              assert old in text, path
              write(path, text.replace(old, new, 1))
          PY

      - name: Regenerate embedded web UI
        run: python Unterbrechungszaehler/tools/build_web.py

      - name: Run portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py

      - name: Commit generated fix to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unterbrechungszaehler README.md docs
          git diff --cached --check
          git commit -m "Secure fallback AP and simplify OTA UI"
          git push origin HEAD:fix/ota-ui-ap
