name: Apply 3.3.2 patch

on:
  push:
    branches:
      - feature/3.3.2-audio-test-finish
    paths:
      - .github/patch_332.py
      - .github/workflows/patch-332.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.3.2-audio-test-finish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patch_332.py
      - name: Portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py
      - name: Commit 3.3.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md docs/de/README.md docs/en/README.md docs/swg/README.md Unterbrechungszaehler
          git diff --cached --check
          git commit -m "Prepare 3.3.2 audio diagnostic completion fix"
          git push origin HEAD:feature/3.3.2-audio-test-finish
