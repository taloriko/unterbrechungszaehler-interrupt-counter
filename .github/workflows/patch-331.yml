name: Apply 3.3.1 diagnostics patch

on:
  push:
    branches:
      - feature/3.3.1-dy-sv17f-diagnostics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.3.1-dy-sv17f-diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 3.3.1 patch
        run: python .github/patch_331.py
      - name: Rebuild Web UI
        run: python Unterbrechungszaehler/tools/build_web.py
      - name: Portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py
      - name: Commit feature changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md docs Unterbrechungszaehler
          git commit -m 'Prepare 3.3.1 DY-SV17F diagnostics'
          git push origin HEAD:feature/3.3.1-dy-sv17f-diagnostics
