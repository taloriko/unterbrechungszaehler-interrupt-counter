name: Apply 3.1.0 feature patch

on:
  push:
    branches:
      - feature/3.1.0-heatmap-interval-display
    paths:
      - .github/workflows/apply-3.1.0.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply 3.1.0 source changes
        run: python3 Unterbrechungszaehler/tools/apply_3_1_0.py

      - name: Regenerate embedded web UI
        run: python3 Unterbrechungszaehler/tools/build_web.py

      - name: Run portable release checks
        run: python3 Unterbrechungszaehler/tools/release_check.py

      - name: Commit generated feature changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unterbrechungszaehler
          git diff --cached --check
          git commit -m "Add average interval heatmaps and display control"
          git push origin HEAD:feature/3.1.0-heatmap-interval-display
