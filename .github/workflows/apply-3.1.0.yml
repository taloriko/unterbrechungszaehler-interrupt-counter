name: Prepare 3.1.0 documentation

on:
  push:
    branches:
      - feature/3.1.0-heatmap-interval-display
    paths:
      - .github/workflows/apply-3.1.0.yml

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply documentation changes
        run: python3 Unterbrechungszaehler/tools/apply_3_1_0_docs.py

      - name: Run portable release checks
        run: python3 Unterbrechungszaehler/tools/release_check.py

      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs Unterbrechungszaehler/README.md Unterbrechungszaehler/PROJECT_ARCHITECTURE.md Unterbrechungszaehler/TEST_REPORT.md Unterbrechungszaehler/RELEASE_NOTES.md
          git diff --cached --check
          git commit -m "Document Unterbrechungszaehler 3.1.0"
          git push origin HEAD:feature/3.1.0-heatmap-interval-display
