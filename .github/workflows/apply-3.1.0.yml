name: Polish 3.1.0 feature

on:
  push:
    branches:
      - feature/3.1.0-heatmap-interval-display
    paths:
      - .github/workflows/apply-3.1.0.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply runtime polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Unterbrechungszaehler/display_views.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'bool dimmed = false;\nbool displayPowerOn = true;\n'
          new = 'bool dimmed = false;\nbool displayPowerOn = true;\nbool manualTestWasActive = false;\n'
          if old not in text:
              raise SystemExit('display state marker missing')
          text = text.replace(old, new, 1)

          old = '''  if (DisplaySh1106::manualTestActive()) {
              displayPowerOn = true;
              return;
            }
          '''
          new = '''  if (DisplaySh1106::manualTestActive()) {
              manualTestWasActive = true;
              displayPowerOn = true;
              return;
            }
            if (manualTestWasActive) {
              manualTestWasActive = false;
              renderRequested = true;
              lastContrast = -1;
            }
          '''
          if old not in text:
              raise SystemExit('manual test marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('Unterbrechungszaehler/interruption_api.cpp')
          text = path.read_text(encoding='utf-8')
          old = '  ctx = AnalyticsBundleContext{};\n'
          new = '  memset(&ctx, 0, sizeof(ctx));\n'
          if old not in text:
              raise SystemExit('analytics context reset marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run portable release checks
        run: python3 Unterbrechungszaehler/tools/release_check.py

      - name: Commit runtime polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unterbrechungszaehler/display_views.cpp Unterbrechungszaehler/interruption_api.cpp
          git diff --cached --check
          git commit -m "Harden display test recovery and analytics memory use"
          git push origin HEAD:feature/3.1.0-heatmap-interval-display
