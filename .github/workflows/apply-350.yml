name: Apply 3.5.0 integration

on:
  push:
    branches:
      - feature/3.5.0-focus-insights
    paths:
      - .github/apply_350.py
      - .github/workflows/apply-350.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/3.5.0-focus-insights
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source integration
        run: python .github/apply_350.py
      - name: Regenerate embedded web bundle
        run: python Unterbrechungszaehler/tools/build_web.py
      - name: Run portable release checks
        run: python Unterbrechungszaehler/tools/release_check.py
      - name: Commit generated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Focus & Insights 3.5.0"
          git push origin HEAD:feature/3.5.0-focus-insights
