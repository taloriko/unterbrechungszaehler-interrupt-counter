name: Prepare 3.0.1 release bump

on:
  push:
    branches:
      - release/3.0.1
    paths:
      - .github/workflows/release-301-one-shot.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump release metadata to 3.0.1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              if count is None:
                  text = text.replace(old, new)
              else:
                  text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          replace('Unterbrechungszaehler/config.h',
                  'constexpr char SOFTWARE_VERSION[] = "3.0.0";',
                  'constexpr char SOFTWARE_VERSION[] = "3.0.1";', 1)

          replace('Unterbrechungszaehler/tools/release_check.py',
                  'Unterbrechungszaehler 3.0.0',
                  'Unterbrechungszaehler 3.0.1')
          replace('Unterbrechungszaehler/tools/release_check.py',
                  'project version 3.0.0',
                  'project version 3.0.1')
          replace('Unterbrechungszaehler/tools/release_check.py',
                  'SOFTWARE_VERSION[] = "3.0.0"',
                  'SOFTWARE_VERSION[] = "3.0.1"')

          replace('README.md',
                  '> **Aktueller Stand:** `3.0.0`',
                  '> **Aktueller Stand:** `3.0.1`', 1)

          replacements = {
              'docs/de/README.md': ('# Unterbrechungszähler 3.0.0', '# Unterbrechungszähler 3.0.1'),
              'docs/en/README.md': ('# Interruption Counter 3.0.0', '# Interruption Counter 3.0.1'),
              'docs/swg/README.md': ('# Unterbrechungszähler 3.0.0 – Schwäbisch', '# Unterbrechungszähler 3.0.1 – Schwäbisch'),
              'docs/de/HARDWARE.md': ('# Hardware – Unterbrechungszähler 3.0.0', '# Hardware – Unterbrechungszähler 3.0.1'),
              'docs/en/HARDWARE.md': ('# Hardware – Interruption Counter 3.0.0', '# Hardware – Interruption Counter 3.0.1'),
              'docs/de/SOFTWARE.md': ('# Software, Build und Flashen – 3.0.0', '# Software, Build und Flashen – 3.0.1'),
              'docs/en/SOFTWARE.md': ('# Software, Build and Flashing – 3.0.0', '# Software, Build and Flashing – 3.0.1'),
              'Unterbrechungszaehler/README.md': ('# Unterbrechungszähler 3.0.0 – technische Übersicht', '# Unterbrechungszähler 3.0.1 – technische Übersicht'),
          }
          for path, (old, new) in replacements.items():
              replace(path, old, new, 1)

          replace('Unterbrechungszaehler/README.md',
                  'Dies ist der Sketchordner der Version **3.0.0**',
                  'Dies ist der Sketchordner der Version **3.0.1**', 1)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## 3.0.1\n' in text:
              raise SystemExit('3.0.1 changelog entry already exists')
          entry = '''## 3.0.1

Patch-Release für die OTA-Oberfläche und den Fallback-Access-Point. Die 3.0.0-Baseline bleibt unverändert; 3.0.1 korrigiert und verbessert ausschließlich den aktuellen 3.x-Stand.

### Änderungen

- Fallback-AP ist mit dem festen Passwort `Unterbrechungszähler` geschützt
- irreführender Hinweis auf einen offenen Fallback-AP vollständig aus der OTA-Oberfläche und allen UI-Sprachpaketen entfernt
- statischer Hinweis auf eine fehlende zweite OTA-App-Partition aus der normalen OTA-Karte entfernt; echte OTA-Fehlerdiagnose bei einem tatsächlichen Partitionsfehler bleibt erhalten
- OTA-Speicherwerte bleiben als Byte-Angaben sichtbar und werden zusätzlich als segmentierter Auslastungsbalken dargestellt
- Geräte-API liefert dafür `ota.usedPercent`
- Releasechecks prüfen AP-Schutz, entfernte Alt-Hinweise und den OTA-Auslastungsbalken
- Dokumentation für Deutsch, Englisch und Schwäbisch auf den passwortgeschützten Fallback-AP und den aktuellen Stand 3.0.1 aktualisiert

'''
          text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          notes = Path('Unterbrechungszaehler/RELEASE_NOTES.md')
          text = notes.read_text(encoding='utf-8')
          current = '''# Release Notes – Unterbrechungszähler 3.0.1

3.0.1 ist ein Patch-Release auf Basis von 3.0.0.

## Änderungen gegenüber 3.0.0

- passwortgeschützter Fallback-AP mit `Unterbrechungszähler`
- alte statische OTA-/AP-Warnungen aus der normalen Oberfläche entfernt
- echte OTA-Fehlerdiagnose bleibt für tatsächliche Updatefehler erhalten
- OTA-Speicher zusätzlich als segmentierter Auslastungsbalken
- `ota.usedPercent` in der Geräte-API
- aktualisierte Releasechecks und Dokumentation

---

'''
          if not text.startswith('# Release Notes – Unterbrechungszähler 3.0.1'):
              notes.write_text(current + text, encoding='utf-8')

          # This helper is intentionally one-shot.
          Path('.github/workflows/release-301-one-shot.yml').unlink()
          PY

      - name: Run release checks
        run: python Unterbrechungszaehler/tools/release_check.py

      - name: Commit release bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare release 3.0.1"
          git push origin HEAD:release/3.0.1
