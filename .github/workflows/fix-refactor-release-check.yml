name: Fix refactor release-check helper

on:
  push:
    branches:
      - design/433mhz-multisource

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run refactor release-check correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/433mhz-multisource
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Correct release-check patch helper
        run: python Unterbrechungszaehler/tools/fix_refactor_release_check_helper.py
      - name: Commit corrected refactor helper
        run: |
          git config user.name 'taloriko'
          git config user.email '67206692+taloriko@users.noreply.github.com'
          git add Unterbrechungszaehler/tools/apply_modular_hardware_refactor.py
          git commit -m 'Correct modular hardware release-check patch'
          git push
