name: Clean 3.2.0 temporary helpers

on:
  push:
    branches:
      - feature/3.2.0-work
    paths:
      - .github/workflows/cleanup-3.2.0.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Final portable checks before cleanup
        run: python3 Unterbrechungszaehler/tools/release_check.py
      - name: Remove temporary implementation helpers
        shell: bash
        run: |
          git rm .github/workflows/apply-3.2.0.yml
          git rm .github/workflows/polish-3.2.0.yml
          git rm .github/workflows/cleanup-3.2.0.yml
          git rm Unterbrechungszaehler/tools/apply_3_2_0_firmware.py
          git rm Unterbrechungszaehler/tools/apply_3_2_0_ui_docs.py
          git rm Unterbrechungszaehler/tools/fix_3_2_0_ota_hint.py
          git rm Unterbrechungszaehler/tools/polish_3_2_0_cpp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Remove temporary 3.2.0 implementation helpers"
          git push origin HEAD:feature/3.2.0-work
